<div class="mx-auto max-w-7xl px-3 py-3.5">
  <main class="min-w-0">
    <div class="mx-auto max-w-2xl">
      <section class="rounded-2xl border border-slate-200 bg-white p-5 shadow-sm sm:p-6">
        <div class="mb-5 flex items-center gap-3">
          <span
            class="inline-flex h-10 w-10 items-center justify-center rounded-full bg-[#e7f3ff] text-[#1877f2]"
            ><svg
              xmlns="http://www.w3.org/2000/svg"
              width="18"
              height="18"
              viewBox="0 0 24 24"
              fill="none"
              stroke="currentColor"
              stroke-width="2"
              stroke-linecap="round"
              stroke-linejoin="round"
              class="lucide lucide-key-round"
              aria-hidden="true"
            >
              <path
                d="M2.586 17.414A2 2 0 0 0 2 18.828V21a1 1 0 0 0 1 1h3a1 1 0 0 0 1-1v-1a1 1 0 0 1 1-1h1a1 1 0 0 0 1-1v-1a1 1 0 0 1 1-1h.172a2 2 0 0 0 1.414-.586l.814-.814a6.5 6.5 0 1 0-4-4z"
              ></path>
              <circle cx="16.5" cy="7.5" r=".5" fill="currentColor"></circle>
            </svg>
          </span>
          <div>
            <h1 class="text-xl font-extrabold text-slate-900 sm:text-2xl">Change Password</h1>
            <p class="text-sm text-slate-500">
              Keep your account secure by using a strong password.
            </p>
          </div>
        </div>
        <form [formGroup]="ChangePassForm" (ngSubmit)="submitForm()" class="space-y-4">
          <label class="block"
            ><span class="mb-1.5 block text-sm font-bold text-slate-700">Current password</span
            ><input
              placeholder="Enter current password"
              [class.focus:border-rose-300]="
                ChangePassForm.get('password')?.invalid && ChangePassForm.get('password')?.touched
              "
              [class.border-rose-300!]="
                ChangePassForm.get('password')?.invalid && ChangePassForm.get('password')?.touched
              "
              formControlName="password"
              class="w-full rounded-xl border bg-slate-50 px-3 py-2.5 text-sm text-slate-800 outline-none transition border-slate-200 focus:border-[#1877f2] focus:bg-white"
              type="password"
              value=""
            />
            @if (
              ChangePassForm.get('password')?.hasError('required') &&
              ChangePassForm.get('password')?.touched
            ) {
              <span class="mt-1 block text-xs text-red-500">Current password is required.</span>
            }</label
          ><label class="block"
            ><span class="mb-1.5 block text-sm font-bold text-slate-700">New password</span
            ><input
              placeholder="Enter new password"
              [class.focus:border-rose-300]="
                ChangePassForm.get('newPassword')?.invalid &&
                ChangePassForm.get('newPassword')?.touched
              "
              [class.border-rose-300!]="
                ChangePassForm.get('newPassword')?.invalid &&
                ChangePassForm.get('newPassword')?.touched
              "
              formControlName="newPassword"
              class="w-full rounded-xl border bg-slate-50 px-3 py-2.5 text-sm text-slate-800 outline-none transition border-slate-200 focus:border-[#1877f2] focus:bg-white"
              type="password"
              value=""
            />
            @if (
              ChangePassForm.get('newPassword')?.invalid &&
              ChangePassForm.get('newPassword')?.touched
            ) {
              @if (
                ChangePassForm.get('newPassword')?.hasError('required') &&
                ChangePassForm.get('newPassword')?.touched
              ) {
                <span class="mt-1 block text-xs text-red-500">New password is required.</span>
              } @else {
                <span class="mt-1 block text-xs text-red-500"
                  >At least 8 characters with uppercase, lowercase, number, and special
                  character.</span
                >
              }
            }</label
          ><label class="block"
            ><span class="mb-1.5 block text-sm font-bold text-slate-700">Confirm new password</span
            ><input
              [class.focus:border-rose-300]="
                ChangePassForm.get('confirmNewPassword')?.invalid &&
                ChangePassForm.get('confirmNewPassword')?.touched
              "
              [class.border-rose-300!]="
                ChangePassForm.get('confirmNewPassword')?.invalid &&
                ChangePassForm.get('confirmNewPassword')?.touched
              "
              formControlName="confirmNewPassword"
              placeholder="Re-enter new password"
              class="w-full rounded-xl border bg-slate-50 px-3 py-2.5 text-sm text-slate-800 outline-none transition border-slate-200 focus:border-[#1877f2] focus:bg-white"
              type="password"
              value=""
            />
            @if (
              ChangePassForm.get('confirmNewPassword')?.invalid &&
              ChangePassForm.get('confirmNewPassword')?.touched
            ) {
              @if (ChangePassForm.get('confirmNewPassword')?.hasError('required')) {
                <span class="mt-1 block text-xs text-red-500"
                  >Please confirm your new password.</span
                >
              } @else if (ChangePassForm.get('confirmNewPassword')?.hasError('misMatch')) {
                <p class="mt-1 block text-xs text-red-500">Passwords do not match.</p>
              }
            }
          </label>
          <button
            type="submit"
            class="inline-flex w-full items-center justify-center rounded-xl bg-[#1877f2] px-4 py-2.5 text-sm font-bold text-white transition hover:bg-[#166fe5] disabled:cursor-not-allowed disabled:opacity-60"
            [disabled]="loading() || ChangePassForm.invalid"
          >
            {{ loading() ? 'Updating...' : 'Update password' }}
          </button>
        </form>
        <p>{{ msgError() }}</p>
      </section>
    </div>
  </main>
</div>
