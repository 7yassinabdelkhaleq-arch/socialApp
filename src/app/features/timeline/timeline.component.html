<div class="mx-auto max-w-7xl px-3 py-3.5">
  <main class="min-w-0">
    <div class="grid gap-4 xl:grid-cols-[240px_minmax(0,1fr)_300px]">
      <!-- side left -->
      <app-side-left
        [activeSection]="activeSection()"
        (sectionChange)="onSectionChange($event)"
      ></app-side-left>
      <!-- posts -->
      <app-posts [section]="activeSection()"></app-posts>
      <!-- side right -->
      <app-side-right></app-side-right>
    </div>
  </main>
</div>
